camera:
  resolution: [1280, 720]  # 720p (ユーザーのカメラに合わせて調整可)
  fps: 30                   # フレームレート
  device_number: 0          # カメラデバイス番号（複数カメラがある場合は1, 2...）

gesture:
  confirmation_frames: 10      # 10フレーム連続で確定
  cooldown_seconds: 5          # 5秒クールダウン
  detection_confidence: 0.5
  ok_sign_timeout_seconds: 7    # OKサイン起動後の受付時間（秒）
  ok_sign_threshold_frames: 3   # OKサイン起動に必要な連続検出フレーム数
  ok_sign_distance_threshold: 0.05  # 親指と人差し指の距離しきい値

switchbot:
  token: "YOUR_API_TOKEN_HERE"          # SwitchBot APIトークン
  secret: "YOUR_API_SECRET_HERE"        # SwitchBot シークレットキー

# 追加可能なデバイス一覧
# key: gesture_actions から参照する識別子
devices:
  - key: light_main
    id: "YOUR_DEVICE_ID_1"
    name: "Main Light"
    type: "plug-mini"
    enabled: true
  - key: fan_room
    id: "YOUR_DEVICE_ID_2"
    name: "Room Fan"
    type: "plug-mini"
    enabled: true

# ジェスチャIDごとの実行アクション（複数指定可）
# 1: パー, 2: グー, 3: ワン
# 形式:
# - "light_main"  # 旧形式（toggle実行）
# - { device: "light_main", command: "turnOn", parameter: "default" }
gesture_actions:
  "1":
    - device: "light_main"
      command: "toggle"
      parameter: "default"
  "2":
    - device: "fan_room"
      command: "toggle"
      parameter: "default"
  "3":
    - device: "light_main"
      command: "turnOn"
      parameter: "default"
    - device: "fan_room"
      command: "turnOff"
      parameter: "default"

# 使用方法:
# 1. このファイルを複製して config.yaml として保存
# 2. YOUR_API_TOKEN_HERE と YOUR_API_SECRET_HERE を実際の値で置き換え
# 3. devices に使用デバイスを追加し、gesture_actions でコマンドを割り当て
# 4. カメラやジェスチャ設定を必要に応じて調整
